services:
  nginx:
    build: .
    image: label-studio-nginx:latest
    pull_policy: build
    networks:
      - label-studio
    restart: unless-stopped
    ports:
      - "8080:8085"
      - "8081:8086"
    depends_on:
      - app
    environment:
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
    volumes:
      - ./mydata:/label-studio/data:rw
      - ./deploy/nginx/certs:/certs:ro
    command: nginx

  app:
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: Dockerfile.custom
      args:
        BASE_IMAGE: label-studio-base
      additional_contexts:
        label-studio-base: service:nginx
    image: label-studio-app:latest
    pull_policy: build
    networks:
      - label-studio
    user: ops-admin
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - postgres
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=postgres
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data/local_storage
      - JSON_LOG=1
      #- LOG_LEVEL=DEBUG
    volumes:
      - ./mydata:/label-studio/data:rw
    command: label-studio-uwsgi

  postgres:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:17.11-alpine3.24
    image: label-studio-postgres:17.11-alpine3.24
    pull_policy: build
    networks:
      - label-studio
    hostname: postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql/data
      - ./deploy/pgsql/certs:/var/lib/postgresql/certs:ro

networks:
  label-studio:
    external: true
